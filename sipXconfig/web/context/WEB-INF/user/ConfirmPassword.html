<span jwcid="$content$">
	<tr jwcid="passwordPanel" for="cp:password">
		<div class="password-wrapper">
			<input jwcid="password" id="cp:password" type="password" autocomplete="off"/>
		</div>
	</tr>
	<tr jwcid="confirmPasswordPanel" for="cp:confirmPassword">
		<div class="password-wrapper">
			<input jwcid="confirmPassword" id="cp:confirmPassword" type="password" autocomplete="off"/>
		</div>
	</tr>
</span>
