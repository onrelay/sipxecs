<span jwcid="actionSelection@common/FlexiblePropertySelection"
      model="ognl:selectionModel"
      onchange="document.getElementById('refresh').click();"
      value="ognl:didPoolSearch.mode"
      renderer="bean:propertyRenderer">
</span>

<span jwcid="@If" condition="ognl:didPoolSearch.search" renderTag="false">
    <input jwcid="renderQuery@TextField" type="text" value="ognl:didPoolSearch.term[0]" />
    <input jwcid="search@Submit" value="message:button.search" />
</span>
