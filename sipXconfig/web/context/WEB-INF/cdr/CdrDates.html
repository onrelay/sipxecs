<span jwcid="$content$">
  <span jwcid="@common/ErrorMsg" validator="bean:validator"/>
  <form jwcid="@Form" delegate="bean:validator">
  	<fieldset>
      <table>
        <tr jwcid="timezones">
            <input jwcid="timezonesSelection" class="small-input"/>
        </tr>
        <tr jwcid="startTime"/>
        <tr jwcid="endTime"/>
      </table>
  	</fieldset>
    <ul class="form-actions">
      <input jwcid="apply" id="form:apply" type="button" class="small-button"/>
    </ul>
  </form>
</span>
