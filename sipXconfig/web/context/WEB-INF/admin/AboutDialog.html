<span jwcid="@Script" scriptAsset="asset:aboutDialogScript"/>

<a jwcid="about@DirectLink" id="aboutLink" href="javascript:void(0);" listener="listener:showDialog" updateComponents="aboutDialog">
    <span jwcid="@Insert" value="ognl:linkTitle">Link</span>
</a>

<div jwcid="aboutDialog@Any" id="aboutDialog" class="dialog" style="display:none;">
    <div class="dialogTitle">
        <span jwcid="@Insert" value="ognl:linkTitle"/>
    </div>
     <span jwcid="@Insert" raw="true" value="ognl:about.content"/>
     <table width="100%" cellpadding="10">
        <tr>
            <td align="right">
                <input jwcid="close@Any" id="aboutClose" type="button" value="message:close" name="close"/>
            </td>
        </tr>
     </table>
</div>
